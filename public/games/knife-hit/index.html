<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- site-only:start (scripts/package.mjs strips this from Playables bundles) -->
  <script>
    // Relative paths need the trailing slash: /games/x -> /games/x/
    if (/^https?:$/.test(location.protocol) && !/(\/|\.html)$/.test(location.pathname)) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <!-- site-only:end -->
  <meta name="game-help" content="Tap to throw a knife into the spinning target. Land every knife to burst the log and move on, but hit a knife that's already stuck and the run ends. Slice the apples on the rim for coins. Every fifth stage is a boss target with a nastier spin.">
  <title>Knife Hit 3D</title>
  <!-- playables-sdk: scripts/package.mjs puts the YouTube Playables SDK here in
       YouTube builds. The website must not load it: off YouTube its calls wait
       for a host that never answers, which leaves the game on a black screen. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../shared/vendor/three.min.js",
        "flagship": "../../shared/flagship.js",
        "sfx": "../../shared/sfx.js",
        "look": "../../shared/look.js"
      }
    }
  </script>
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="../../shared/flagship.css">
  <style>:root { --accent: #ff4d6d; --accent-2: #ffd60a; } html, body { background: #170d26; }</style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script src="../../shared/yt.js"></script>
  <script type="module" src="game.js"></script>
  <script src="../../shared/help.js" defer></script>
</body>
</html>
