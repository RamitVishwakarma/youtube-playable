<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- site-only:start (scripts/package.mjs strips this from Playables bundles) -->
  <script>
    // Relative paths need the trailing slash: /games/x -> /games/x/
    if (/^https?:$/.test(location.protocol) && !/(\/|\.html)$/.test(location.pathname)) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <!-- site-only:end -->
  <meta name="game-help" content="Drag left and right to spin the tower so the bouncing ball falls through the gaps. Red slices are deadly. Fall through three floors in a row to become a fireball that smashes anything.">
  <title>Helix Drop 3D</title>
  <!-- playables-sdk: scripts/package.mjs puts the YouTube Playables SDK here in
       YouTube builds. The website must not load it: off YouTube its calls wait
       for a host that never answers, which leaves the game on a black screen. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../shared/vendor/three.min.js",
        "flagship": "../../shared/flagship.js",
        "sfx": "../../shared/sfx.js"
      }
    }
  </script>
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="../../shared/flagship.css">
  <style>:root { --accent: #b15cff; --accent-2: #ffd60a; } html, body { background: #6a5cff; }</style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script src="../../shared/yt.js"></script>
  <script type="module" src="game.js"></script>
  <script src="../../shared/help.js" defer></script>
</body>
</html>
