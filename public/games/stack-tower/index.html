<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- site-only:start (scripts/package.mjs strips this from Playables bundles) -->
  <script>
    // Relative paths need the trailing slash: /games/x -> /games/x/
    if (/^https?:$/.test(location.protocol) && !/(\/|\.html)$/.test(location.pathname)) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <!-- site-only:end -->
  <meta name="game-help" content="Tap to drop the sliding block onto the tower. Anything hanging over the edge is sliced off, so the next block is smaller. Land a perfect drop to keep the full size, and chain perfects to grow it back." data-right="60">
  <title>Stack Tower 3D</title>
  <!-- playables-sdk: scripts/package.mjs puts the YouTube Playables SDK here in
       YouTube builds. The website must not load it: off YouTube its calls wait
       for a host that never answers, which leaves the game on a black screen. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../shared/vendor/three.min.js",
        "flagship": "../../shared/flagship.js",
        "sfx": "../../shared/sfx.js",
        "look": "../../shared/look.js"
      }
    }
  </script>
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="../../shared/flagship.css">
  <style>:root { --accent: #c56cf0; --accent-2: #45aaf2; } html, body { background: #c56cf0; }</style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script src="../../shared/yt.js"></script>
  <script type="module" src="game.js"></script>
  <script src="../../shared/help.js" defer></script>
</body>
</html>
