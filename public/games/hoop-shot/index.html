<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- site-only:start (scripts/package.mjs strips this from Playables bundles) -->
  <script>
    // Relative paths need the trailing slash: /games/x -> /games/x/
    if (/^https?:$/.test(location.protocol) && !/(\/|\.html)$/.test(location.pathname)) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <!-- site-only:end -->
  <meta name="game-help" content="Swipe up toward the hoop to shoot: the direction aims and the length sets the power. Score the target before the 40-second clock runs out. A swish is worth 3 and a rim-in 2. Make three in a row and you're ON FIRE for double points. From level 3 the hoop starts moving.">
  <title>Hoop Shot 3D</title>
  <!-- playables-sdk: scripts/package.mjs puts the YouTube Playables SDK here in
       YouTube builds. The website must not load it: off YouTube its calls wait
       for a host that never answers, which leaves the game on a black screen. -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../shared/vendor/three.min.js",
        "flagship": "../../shared/flagship.js",
        "sfx": "../../shared/sfx.js",
        "look": "../../shared/look.js",
        "models": "../../shared/models.js"
      }
    }
  </script>
  <link rel="stylesheet" href="../../shared/game.css">
  <link rel="stylesheet" href="../../shared/flagship.css">
  <style>:root { --accent: #ff7b00; --accent-2: #3a86ff; } html, body { background: #0b1030; }</style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script src="../../shared/yt.js"></script>
  <script type="module" src="game.js"></script>
  <script src="../../shared/help.js" defer></script>
</body>
</html>
