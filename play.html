<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play · Playables Arcade</title>
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body class="play-page">
  <div class="bar">
    <a class="back" href="./">← All games</a>
    <h1 id="title">Loading…</h1>
    <button type="button" id="frameToggle" class="hide-sm" title="Switch between phone frame and full width">📱 Phone</button>
    <button type="button" id="restart" title="Reload the game">↻ Reload</button>
    <button type="button" id="fullscreen" title="Fullscreen">⛶</button>
  </div>
  <div class="stage">
    <div class="frame phone" id="frame"><iframe id="game" title="Game" allow="autoplay; fullscreen"></iframe></div>
    <aside class="side">
      <div class="box"><h3>How to play</h3><p id="how"></p></div>
      <div class="box"><h3>Optional rewarded ads</h3><ul id="rewards"></ul></div>
      <div class="box"><h3>More games</h3><div id="more"></div></div>
    </aside>
  </div>
  <script src="games.js"></script>
  <script src="assets/portal.js"></script>
</body>
</html>
